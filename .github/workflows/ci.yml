name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned development dependencies
        run: bun install --frozen-lockfile

      - name: Audit development dependencies
        run: bun audit --audit-level=high

      - name: Run tests and strict typecheck
        run: |
          bun run public-check
          # A timed-out async test can still touch fixtures during cleanup.
          # Stop at the first failure rather than cascading into the job deadline.
          bun run test --bail
          bun run typecheck

      - name: Check installer syntax
        run: |
          bash -n install.sh
          python3 -m py_compile scripts/install-config.py

      - name: Check shell safety
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Run isolated strict installer integration
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-workbench-agent
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ./install.sh --strict

      - name: Ensure verification did not modify source
        run: git diff --exit-code
